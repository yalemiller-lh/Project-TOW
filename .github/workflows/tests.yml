# Runs every test file on each push to main and on pull requests.
# GitHub Pages deploys the site itself from the main branch (repository root):
# index.html opens Play.html, the bundled game.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: for f in test-*.mjs; do node "$f"; done
      - name: Check Play.html is rebuilt from dist/
        run: node package-standalone.mjs && git diff --ignore-cr-at-eol --exit-code --stat Play.html
