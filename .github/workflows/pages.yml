# Publishes the game to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is dist/ (index.html loads the modules), plus the bundled Play.html for offline use.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: for f in test-*.mjs; do node "$f"; done
      - name: Build the standalone page
        run: node package-standalone.mjs && cp Play.html dist/Play.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
